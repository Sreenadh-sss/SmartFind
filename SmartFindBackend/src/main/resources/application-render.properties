# ==============================================================================
# SmartFind - Configuration for Render Cloud Deployment
# Automatically runs an embedded database with zero external setup required
# ==============================================================================

server.port=${PORT:8083}
spring.application.name=smartfind-backend

# Embedded H2 in-memory database with MySQL emulation
spring.datasource.url=jdbc:h2:mem:smartfind_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate ORM settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 4-Factor AI Matching Engine threshold
matching.threshold=60.0

# Logging
logging.level.com.smartfind=INFO
logging.level.org.springframework.web=INFO
