# ===================================================================
# SmartFind - AI-Based Smart Lost & Found System Configuration
# ===================================================================

# Server Port
server.port=8083

# Application Name
spring.application.name=smartfind-backend

# MySQL Database Configuration
# Supports environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartfind_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AI-Based Matching Engine Configuration
# Similarity threshold percentage (0 to 100)
matching.threshold=60.0

# Logging Configuration
logging.level.com.smartfind=INFO
logging.level.org.springframework.web=INFO
