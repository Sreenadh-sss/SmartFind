services:
  # 1. MySQL Database Container
  mysql-db:
    image: mysql:8.0
    container_name: smartfind-mysql
    restart: always
    environment:
      MYSQL_DATABASE: smartfind_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartfind-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Spring Boot Backend Container
  smartfind-backend:
    build:
      context: ./SmartFindBackend
      dockerfile: Dockerfile
    container_name: smartfind-backend
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/smartfind_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
    networks:
      - smartfind-network

  # 3. Frontend Web Server (Nginx)
  smartfind-frontend:
    image: nginx:alpine
    container_name: smartfind-frontend
    restart: always
    ports:
      - "5500:80"
    volumes:
      - ./SmartFindFrontend:/usr/share/nginx/html:ro
    networks:
      - smartfind-network

volumes:
  mysql_data:

networks:
  smartfind-network:
    driver: bridge
